<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tankōbon – lettore manga</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#ececee;--ink:#16161a;--sub:#5d5d68;--card:#fff;--line:#16161a;--acc:#2a37a8;--accfg:#fff;--dot:rgba(22,22,26,.13);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--ink:#f1f1f4;--sub:#a0a0ad;--card:#1f1f27;--line:#f1f1f4;--acc:#8f9bff;--accfg:#10102a;--dot:rgba(241,241,244,.1)}}
:root[data-theme="dark"]{--bg:#15151a;--ink:#f1f1f4;--sub:#a0a0ad;--card:#1f1f27;--line:#f1f1f4;--acc:#8f9bff;--accfg:#10102a;--dot:rgba(241,241,244,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Noto Serif JP",Georgia,serif}
body{background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:9px 9px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:22px 18px 8px}
h1{margin:0;font-size:34px;letter-spacing:.02em;font-weight:900}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:4px;letter-spacing:0}
.bar{display:flex;gap:10px;padding:12px 18px 6px;flex-wrap:wrap}
.btn{border:2.5px solid var(--line);background:var(--card);padding:10px 14px;border-radius:4px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.acc{background:var(--acc);color:var(--accfg);border-color:var(--line)}
h2{margin:18px 18px 4px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:12px 18px 40px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.vol{background:none;border:0;padding:0;text-align:left}
.vol .cv{display:block;aspect-ratio:600/850;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);background:#fff;overflow:hidden}
.vol .cv img{width:100%;height:100%;object-fit:cover;display:block}
.vol b{display:block;margin-top:10px;font-size:14px;line-height:1.3}
.vol span.m{font-size:12px;color:var(--sub)}
.empty{padding:6px 18px;color:var(--sub);font-size:14px;line-height:1.5}
#rd{position:fixed;inset:0;background:#0c0c0f;display:none;flex-direction:column;z-index:5;color:#f1f1f4}
#rd.on{display:flex}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
#pg{max-width:100%;max-height:100%;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}
.ui{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(12,12,15,.88);transition:opacity .15s;z-index:2}
.ui.hide{opacity:0;pointer-events:none}
#top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#bot{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#ttl{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{background:transparent;border:2px solid #f1f1f4;color:#f1f1f4;border-radius:4px;padding:7px 11px;font-size:13px;font-weight:700}
#sl{flex:1;accent-color:#8f9bff;direction:rtl}
#sl.ltr{direction:ltr}
#cnt{font-size:13px;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.zone{position:absolute;top:0;bottom:0;width:34%;z-index:1}
#zl{left:0}#zr{right:0}
#hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(12,12,15,.85);padding:8px 14px;border-radius:20px;font-size:13px;z-index:3;transition:opacity .6s}
</style>
</head>
<body>
<header>
  <h1>Tankōbon<small>La tua libreria di manga, sempre in tasca.</small></h1>
</header>
<div class="bar">
  <button class="btn acc" id="addImg">Apri immagini</button>
  <button class="btn" id="addCbz">Apri CBZ</button>
  <button class="btn" id="theme">Tema</button>
</div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fCbz" accept=".cbz,.zip" hidden>
<h2>Volumi di prova</h2>
<div class="grid" id="demo"></div>
<h2>I tuoi file</h2>
<p class="empty" id="mine">Nessun volume ancora. Apri le pagine di un capitolo (JPG o PNG) oppure un file CBZ dal tuo telefono: restano solo sul tuo dispositivo.</p>
<div class="grid" id="lib"></div>

<div id="rd">
  <div id="stage">
    <div class="zone" id="zl"></div><div class="zone" id="zr"></div>
    <img id="pg" alt="Pagina del manga">
    <div id="hint"></div>
  </div>
  <div class="ui" id="top"><button class="rb" id="back">Indietro</button><div id="ttl"></div><button class="rb" id="mode">Da destra</button></div>
  <div class="ui" id="bot"><input type="range" id="sl" min="1" value="1"><div id="cnt"></div></div>
</div>

<script>
(function(){
var books=[],cur=null,idx=0,rtl=true;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var $=function(i){return document.getElementById(i)};

/* ---- Pagine di prova disegnate in SVG (storia originale) ---- */
var LAY=[
 [[20,20,560,300],[20,340,270,490],[310,340,270,240],[310,600,270,230]],
 [[20,20,270,400],[310,20,270,400],[20,440,560,390]],
 [[20,20,560,180],[20,220,560,300],[20,540,270,290],[310,540,270,290]]];
var TXT=[["Un’altra notte","sui tetti di Kyoto…"],["Miao.","(Ho fame.)"],["Quella luna","è troppo vicina!"],["Chi è là?!","Fatti vedere!"],["Il gatto","non scappa mai."],["Tre, due,","uno…"],["Salto!","Ce la faccio!"],["Il vento","porta un nome."],["Ci vediamo","domani, Luna."],["Fine del","primo capitolo"],["Wow…","che vista."],["Shhh!","Ti sentono."]];
function panel(x,y,w,h,k,n){
 var cx=x+w/2,cy=y+h/2,s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#fff" stroke="#111" stroke-width="6"/><clipPath id="c'+n+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"/></clipPath><g clip-path="url(#c'+n+')">';
 var t=k%4;
 if(t==0){for(var i=0;i<48;i++){var a=i*Math.PI/24;s+='<line x1="'+(cx+Math.cos(a)*40)+'" y1="'+(cy+Math.sin(a)*40)+'" x2="'+(cx+Math.cos(a)*700)+'" y2="'+(cy+Math.sin(a)*700)+'" stroke="#111" stroke-width="'+(i%3+1)+'"/>'}}
 if(t==1){s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#dots)"/><circle cx="'+(x+w*.7)+'" cy="'+(y+h*.3)+'" r="'+Math.min(w,h)*.22+'" fill="#fff" stroke="#111" stroke-width="4"/>'}
 if(t==2){s+='<rect x="'+x+'" y="'+(y+h*.62)+'" width="'+w+'" height="'+h*.4+'" fill="#111"/><path d="M'+x+' '+(y+h*.62)+' L'+(x+w*.3)+' '+(y+h*.5)+' L'+(x+w*.6)+' '+(y+h*.62)+'Z" fill="#111"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h*.6+'" fill="url(#dots)"/>'}
 if(t==3){var r=Math.min(w,h)*.16,bx=cx,by=y+h*.66;s+='<ellipse cx="'+bx+'" cy="'+by+'" rx="'+r*1.5+'" ry="'+r+'" fill="#111"/><circle cx="'+(bx+r*1.3)+'" cy="'+(by-r*.7)+'" r="'+r*.7+'" fill="#111"/><path d="M'+(bx+r*.8)+' '+(by-r*1.2)+' l'+r*.2+' -'+r*.7+' l'+r*.5+' '+r*.6+'Z M'+(bx+r*1.5)+' '+(by-r*1.2)+' l'+r*.5+' -'+r*.6+' l'+r*.1+' '+r*.8+'Z" fill="#111"/><path d="M'+(bx-r*1.4)+' '+by+' q-'+r+' -'+r*1.4+' '+r*.3+' -'+r*1.6+'" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>'}
 s+='</g>';
 var tx=TXT[n%TXT.length],bw=Math.min(w-30,200),bh=70,bx2=x+(k%2?w-bw-15:15),by2=y+14;
 if(h>150){s+='<ellipse cx="'+(bx2+bw/2)+'" cy="'+(by2+bh/2)+'" rx="'+bw/2+'" ry="'+bh/2+'" fill="#fff" stroke="#111" stroke-width="3.5"/><text x="'+(bx2+bw/2)+'" y="'+(by2+bh/2-4)+'" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="19" fill="#111">'+tx[0]+'</text><text x="'+(bx2+bw/2)+'" y="'+(by2+bh/2+20)+'" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="19" fill="#111">'+tx[1]+'</text>'}
 return s}
function uri(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
var HEAD='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850"><defs><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.9" fill="#111"/></pattern></defs><rect width="600" height="850" fill="#fff"/>';
function demoPages(){
 var out=[],n=0;
 out.push(uri(HEAD+'<rect x="20" y="20" width="560" height="810" fill="none" stroke="#111" stroke-width="8"/><rect x="40" y="40" width="520" height="560" fill="url(#dots)"/><circle cx="400" cy="230" r="120" fill="#fff" stroke="#111" stroke-width="6"/><path d="M40 470 L200 360 L340 470 L460 400 L560 470 L560 600 L40 600Z" fill="#111"/><text x="300" y="690" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#111">Il Gatto</text><text x="300" y="760" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#111">dei Tetti</text></svg>'));
 for(var p=0;p<7;p++){var L=LAY[p%3],s=HEAD;for(var i=0;i<L.length;i++){s+=panel(L[i][0],L[i][1],L[i][2],L[i][3],p+i,n++)}out.push(uri(s+'</svg>'))}
 return out}

/* ---- Libreria ---- */
function natural(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})}
function render(){
 var d=$('demo'),l=$('lib');d.innerHTML='';l.innerHTML='';
 var any=false;
 books.forEach(function(b,i){
  var el=document.createElement('button');el.className='vol';
  var saved=parseInt(ls('p:'+b.id)||'0',10);
  el.innerHTML='<span class="cv"><img alt=""></span><b></b><span class="m"></span>';
  el.querySelector('img').src=b.pages[0];
  el.querySelector('b').textContent=b.title;
  el.querySelector('.m').textContent=b.pages.length+' pagine'+(saved>0?' · a pagina '+(saved+1):'');
  el.onclick=function(){open(i)};
  (b.demo?d:l).appendChild(el);if(!b.demo)any=true});
 $('mine').style.display=any?'none':'block'}
function add(title,pages){books.push({id:title+'|'+pages.length,title:title,pages:pages});render();open(books.length-1)}

/* ---- Lettore ---- */
var uiTimer;
function open(i){
 cur=books[i];idx=Math.min(parseInt(ls('p:'+cur.id)||'0',10),cur.pages.length-1);
 var r=ls('rtl');rtl=r===null?true:r==='1';
 $('ttl').textContent=cur.title;$('sl').max=cur.pages.length;
 $('rd').classList.add('on');setMode();show();showUI(true);
 hint(rtl?'Tocca a sinistra per andare avanti':'Tocca a destra per andare avanti')}
function show(){
 $('pg').src=cur.pages[idx];$('sl').value=idx+1;
 $('cnt').textContent=(idx+1)+' / '+cur.pages.length;
 ls('p:'+cur.id,String(idx));
 var nx=cur.pages[idx+1];if(nx){var im=new Image();im.src=nx}}
function go(d){var n=idx+d;if(n<0||n>=cur.pages.length){hint(d>0?'Fine del volume':'Prima pagina');return}idx=n;show()}
function setMode(){$('mode').textContent=rtl?'Da destra':'Da sinistra';$('sl').className=rtl?'':'ltr'}
function showUI(on){$('top').classList.toggle('hide',!on);$('bot').classList.toggle('hide',!on)}
function hint(t){var h=$('hint');h.textContent=t;h.style.opacity=1;clearTimeout(uiTimer);uiTimer=setTimeout(function(){h.style.opacity=0},1800)}
$('zl').onclick=function(){go(rtl?1:-1)};
$('zr').onclick=function(){go(rtl?-1:1)};
$('pg').onclick=function(){showUI($('top').classList.contains('hide'))};
$('back').onclick=function(){$('rd').classList.remove('on');render()};
$('mode').onclick=function(){rtl=!rtl;ls('rtl',rtl?'1':'0');setMode();hint(rtl?'Lettura da destra a sinistra':'Lettura da sinistra a destra')};
$('sl').oninput=function(){idx=parseInt(this.value,10)-1;show()};
document.addEventListener('keydown',function(e){if(!$('rd').classList.contains('on'))return;
 if(e.key==='ArrowLeft')go(rtl?1:-1);else if(e.key==='ArrowRight')go(rtl?-1:1);else if(e.key==='Escape')$('back').click()});

/* ---- Import ---- */
$('addImg').onclick=function(){$('fImg').click()};
$('addCbz').onclick=function(){$('fCbz').click()};
$('fImg').onchange=function(){
 var f=Array.prototype.slice.call(this.files).sort(natural);if(!f.length)return;
 add('Capitolo '+(books.length),f.map(function(x){return URL.createObjectURL(x)}));this.value=''};
$('fCbz').onchange=function(){
 var f=this.files[0];this.value='';if(!f)return;
 if(typeof JSZip==='undefined'){alert('Impossibile leggere il CBZ: libreria non caricata. Riprova con la connessione attiva.');return}
 JSZip.loadAsync(f).then(function(z){
  var es=[];z.forEach(function(p,e){if(!e.dir&&/\.(jpe?g|png|webp|gif)$/i.test(p))es.push(e)});
  es.sort(natural);
  if(!es.length){alert('Nessuna immagine trovata nel file.');return}
  return Promise.all(es.map(function(e){return e.async('blob').then(function(b){return URL.createObjectURL(b)})})).then(function(u){add(f.name.replace(/\.(cbz|zip)$/i,''),u)})
 }).catch(function(){alert('File non valido. Controlla che sia un CBZ o uno ZIP di immagini.')})};

/* ---- Tema ---- */
$('theme').onclick=function(){
 var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
 var n=dark?'light':'dark';r.setAttribute('data-theme',n);ls('theme',n)};
var t=ls('theme');if(t)document.documentElement.setAttribute('data-theme',t);

books.push({id:'demo-gatto',demo:true,title:'Il Gatto dei Tetti, vol. 1',pages:demoPages()});
render();
})();
</script>
</body>
</html>

name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crea il progetto Android
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android jszip
          mkdir www
          cp index.html www/index.html
          cp node_modules/jszip/dist/jszip.min.js www/
          sed -i 's#https://cdnjs[^"]*jszip[^"]*#jszip.min.js#' www/index.html
          npx cap init Tankobon it.tankobon.reader --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tankobon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
